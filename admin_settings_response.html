<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Admin Settings</title>
    <style>
        /* Reset & Base */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #e0e8ff, #f5e0e8); /* Soft light blue to light pink */
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        /* Main Card */
        .admin-container {
            background: #ffffff;
            width: 420px;
            padding: 35px;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
            animation: fadeIn 0.7s ease-out;
        }

        /* Heading */
        .admin-container h1 {
            text-align: center;
            margin-bottom: 30px;
            color: #2c3e70; /* Deep soft blue for heading */
            font-size: 26px;
            font-weight: 600;
        }

        /* Form Elements */
        form p {
            margin-bottom: 20px;
        }

        form label {
            display: block;
            font-weight: 600;
            margin-bottom: 8px;
            color: #34495e; /* Dark gray-blue for labels */
            font-size: 15px;
        }

        form input,
        form select,
        form textarea {
            width: 100%;
            padding: 12px 14px;
            border-radius: 10px;
            border: 1px solid #d0d8e8;
            background-color: #f9fbff;
            font-size: 15px;
            transition: all 0.3s ease;
        }

        form input:focus,
        form select:focus,
        form textarea:focus {
            border-color: #5d7ce0; /* Soft blue accent on focus */
            background-color: #ffffff;
            outline: none;
            box-shadow: 0 0 0 3px rgba(93, 124, 224, 0.15);
        }

        /* Submit Button */
        button[type="submit"] {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #6b7ee0, #a06cd5); /* Light purple-blue gradient */
            border: none;
            border-radius: 10px;
            color: #ffffff;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-top: 10px;
        }

        button[type="submit"]:hover {
            transform: translateY(-3px);
            box-shadow: 0 12px 25px rgba(107, 126, 224, 0.3);
        }

        button[type="submit"]:active {
            transform: translateY(-1px);
        }

        /* Back Link */
        .back-link {
            display: block;
            margin-top: 25px;
            text-align: center;
            text-decoration: none;
            color: #5d7ce0;
            font-weight: 600;
            font-size: 15px;
            transition: color 0.3s;
        }

        .back-link:hover {
            color: #3a56b0;
            text-decoration: underline;
        }

        /* Animation */
        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* Responsive tweak */
        @media (max-width: 480px) {
            .admin-container {
                width: 90%;
                padding: 25px;
            }
        }
    </style>
</head>
<body>
    <div class="admin-container">
        <h1>Admin Interview Settings</h1>

        

        <div class="mb-3 text-sm text-gray-600">
            <strong>Current Settings:</strong>
            <p>Number of Questions: 2</p>
            <p>Difficulty: Medium</p>
        </div>

        <form method="post">
            <input type="hidden" name="csrfmiddlewaretoken" value="u8DUNWZYjaAIRiuxICCxfiBmiNICQTLw2IpCRSTtn6KU4cNTRDI6zQ3S4KNOVZIJ">
            <p>
    <label for="id_difficulty_level">Difficulty level:</label>
    <select name="difficulty_level" id="id_difficulty_level">
  <option value="Easy">Easy</option>

  <option value="Medium" selected>Medium</option>

  <option value="Hard">Hard</option>

</select>
    
    
  </p>

  
  <p>
    <label for="id_number_of_questions">Number of questions:</label>
    <input type="number" name="number_of_questions" value="2" required id="id_number_of_questions">
    
    
  </p>

  
  <p>
    <label for="id_question_type">Question type:</label>
    <select name="question_type" id="id_question_type">
  <option value="MCQ">MCQ</option>

  <option value="Descriptive" selected>Descriptive</option>

  <option value="Coding">Coding</option>

  <option value="Voice">Voice</option>

</select>
    
    
  </p>

  
  <p>
    <label for="id_interview_date">Interview date:</label>
    <input type="datetime-local" name="interview_date" value="2026-01-31T10:00" required id="id_interview_date"><input type="hidden" name="initial-interview_date" value="2026-01-31T10:00" id="initial-id_interview_date">
    
    
  </p>

  
  <p>
    <label for="id_duration">Duration:</label>
    <input type="number" name="duration" value="60" required id="id_duration">
    
    
  </p>

  <ul class="errorlist" id="id_evaluation_weightage_error"><li>This field is required.</li></ul>
  <p>
    <label for="id_evaluation_weightage">Evaluation weightage:</label>
    <textarea name="evaluation_weightage" cols="40" rows="10" placeholder="{&quot;accuracy&quot;: 0.4, &quot;fluency&quot;: 0.3, &quot;emotion_stability&quot;: 0.2, &quot;eye_contact&quot;: 0.1}" required aria-invalid="true" aria-describedby="id_evaluation_weightage_error" id="id_evaluation_weightage">
{}</textarea><input type="hidden" name="initial-evaluation_weightage" value="{}" aria-describedby="id_evaluation_weightage_error" id="initial-id_evaluation_weightage">
    
    
  </p>

  
  <p>
    <label for="id_enable_emotion_analysis">Enable emotion analysis:</label>
    <input type="checkbox" name="enable_emotion_analysis" id="id_enable_emotion_analysis" checked>
    
    
  </p>

  
  <p>
    <label for="id_enable_voice_interview">Enable voice interview:</label>
    <input type="checkbox" name="enable_voice_interview" id="id_enable_voice_interview" checked>
    
    
      
    
  </p>
            <button type="submit">Save Settings</button>
        </form>
        <a href="/admin-home/" class="back-link">← Back to Home</a>
    </div>
</body>
</html>
